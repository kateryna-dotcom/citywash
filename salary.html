<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שכר</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --blue-dark: #0b4f8a; --blue: #1e6fb8; --blue-light: #eaf3fb;
    --border: #d9e6f0; --text: #1c2b39; --muted: #5b7186;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f4f8fb; color: var(--text); padding: 22px;
  }
  h2 { margin: 0 0 14px; color: var(--blue-dark); font-size: 19px; }

  /* Company buttons */
  .companies { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .company-btn {
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 12px;
    font-family: inherit; font-size: 14.5px; font-weight: 600; color: var(--blue-dark);
    cursor: pointer; text-align: center; line-height: 1.35;
  }
  .company-btn:hover { border-color: var(--blue); background: var(--blue-light); }
  .company-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* Inside a company */
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .panel-title { font-size: 16px; font-weight: 700; color: var(--blue-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .back-btn {
    background: #fff; border: 1px solid var(--border); color: var(--blue-dark); border-radius: 8px;
    padding: 4px 10px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer;
  }
  .back-btn:hover { background: var(--blue-light); }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab {
    background: none; border: none; border-bottom: 3px solid transparent; padding: 9px 18px;
    font-family: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .tab.active { color: var(--blue-dark); border-bottom-color: var(--blue); }
  .placeholder { text-align: center; color: var(--muted); padding: 40px 16px; }
  .placeholder .icon { font-size: 34px; margin-bottom: 8px; }
  .placeholder .soon {
    display: inline-block; background: var(--blue-light); color: var(--blue-dark); padding: 3px 12px;
    border-radius: 20px; font-size: 12.5px; font-weight: 600; margin: 8px 0;
  }
  .empty-hint { text-align: center; color: var(--muted); padding: 50px 16px; }

  /* Monthly work sheet (רמי מרדכיב) */
  .sheet-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .sheet-bar input[type=month] { padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; }
  .sbtn {
    background: #fff; border: 1px solid var(--blue); color: var(--blue); border-radius: 8px; padding: 6px 12px;
    font-size: 13.5px; font-family: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .sbtn.primary { background: var(--blue); color: #fff; }
  .sbtn:hover { filter: brightness(.96); }
  .save-state { font-size: 12.5px; color: var(--muted); }
  .save-state.err { color: #c0392b; }
  .sheet-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table.sheet { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  table.sheet th { background: var(--blue-light); color: var(--blue-dark); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; }
  table.sheet td { border-bottom: 1px solid #eef3f7; border-inline-start: 1px solid #eef3f7; padding: 0; }
  table.sheet input { width: 100%; border: none; padding: 6px 5px; font-family: inherit; font-size: 13px; background: transparent; color: var(--text); }
  table.sheet input:focus { outline: 2px solid var(--blue); background: #fff; }
  table.sheet td.num input { text-align: center; direction: ltr; font-variant-numeric: tabular-nums; }
  table.sheet tr:hover td { background: #fafcfe; }
  table.sheet tr.branch-row td { background: #f3f7fb; font-weight: 700; color: var(--blue-dark); padding: 8px 10px; border-top: 2px solid var(--border); }
  table.sheet tr.branch-row:hover td { background: #f3f7fb; }
  .sbtn.small { padding: 2px 9px; font-size: 12px; margin-inline-start: 10px; }
  .del-row { background: none; border: none; color: #a7b6c4; cursor: pointer; font-size: 16px; padding: 4px 8px; }
  .del-row:hover { color: #c0392b; }
  .sheet-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  .pick-sheet { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
  .pick-sheet select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; }

  /* Salary cost vs last month */
  .cost { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .cost-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cost-title { font-size: 15.5px; font-weight: 700; color: var(--blue-dark); }
  .sample-tag { font-size: 12px; background: #fff4e0; color: #a86a00; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .tile { flex: 1; min-width: 150px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  .tile .label { font-size: 12.5px; color: var(--muted); }
  .tile .value { font-size: 22px; font-weight: 700; color: var(--blue-dark); font-variant-numeric: tabular-nums; }
  .chg { font-weight: 700; white-space: nowrap; direction: ltr; display: inline-block; font-variant-numeric: tabular-nums; }
  .chg.up { color: #c0392b; } .chg.down { color: #1a8a4a; } .chg.flat { color: var(--muted); font-weight: 500; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: middle; }
  .row { display: grid; grid-template-columns: 190px 1fr 96px 70px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid #f0f4f8; }
  .row .name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars { display: flex; flex-direction: column; gap: 3px; }
  .bar { height: 12px; border-radius: 4px 0 0 4px; min-width: 2px; }
  .bar.now { background: var(--blue); }
  .bar.prev { background: #b9cbe0; height: 7px; }
  .row .val { font-size: 13px; font-weight: 600; text-align: left; direction: ltr; font-variant-numeric: tabular-nums; }
  .row .chg { font-size: 12.5px; text-align: left; }
  .trend { display: flex; align-items: flex-end; gap: 8px; height: 110px; margin-top: 14px; padding-top: 6px; border-top: 1px solid var(--border); }
  .trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .trend-bar { width: min(34px, 70%); background: #b9cbe0; border-radius: 4px 4px 0 0; }
  .trend-bar.last { background: var(--blue); }
  .trend-lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .trend-caption { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
  .tooltip { position: fixed; background: var(--text); color: #fff; font-size: 12.5px; padding: 5px 9px; border-radius: 6px; pointer-events: none; display: none; z-index: 10; white-space: nowrap; }

  @media (max-width: 600px) {
    .row { grid-template-columns: 100px 1fr 78px 54px; gap: 6px; }
    body { padding: 12px; }
    .companies { grid-template-columns: 1fr 1fr; }
    .tab { padding: 9px 10px; }
  }
</style>
</head>
<body>
  <h2>💰 שכר</h2>

  <div class="companies" id="companies"></div>
  <div class="cost" id="cost"></div>
  <div class="tooltip" id="tooltip"></div>
  <div id="content"><div class="empty-hint">בחרי חברה</div></div>

<script>
// The five companies Kateryna handles payroll for (2026-11-22). Three of
// them are split into טיפול כוח אדם / טיפול תלוש; the other two get one
// section for now.
const COMPANIES = [
  { id: "abt",  name: 'א.ב.ת. שירותי שטיפה בע"מ',     tabs: true },
  { id: "ubr",  name: 'יו.בי.אר שטיפת רכב בע"מ',      tabs: true },
  { id: "bui",  name: "בי. יו .אי. שטיפת רכבים",       tabs: true },
  { id: "aa",   name: 'א.א. רכב ורכש בע"מ',            tabs: false },
  { id: "rami", name: 'רמי מרדכיב שירותי שטיפה בע"מ',  tabs: false,
    // Its three branches (Kateryna 2026-11-22), in the order of her
    // monthly Excel; `key` is the branch title as written in that file.
    sheet: true,
    branches: [
      { key: "פתח תקווה", label: "פתח תקווה" },
      { key: "גבעת שמואל", label: "גבעת שמואל" },
      { key: "מפגש פתח תקווה", label: "מפגש" },
    ] },
];
const TABS = [
  { id: "hr",      label: "טיפול כוח אדם", icon: "👥", text: "כאן יופיע הטיפול בכוח האדם של החברה." },
  { id: "payslip", label: "טיפול תלוש",   icon: "🧾", text: "כאן יופיע הטיפול בתלושי השכר של החברה." },
];

let current = { company: null, tab: "hr" };

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderCompanies() {
  const el = document.getElementById("companies");
  el.innerHTML = COMPANIES.map(c =>
    `<button class="company-btn ${current.company === c.id ? "active" : ""}" data-id="${c.id}">${escapeHtml(c.name)}</button>`
  ).join("");
  el.querySelectorAll(".company-btn").forEach(b => b.addEventListener("click", () => selectCompany(b.dataset.id)));
}

function placeholder(icon, text) {
  return `<div class="placeholder"><div class="icon">${icon}</div><span class="soon">בקרוב</span><div>${escapeHtml(text)}</div></div>`;
}

function renderContent() {
  const el = document.getElementById("content");
  const c = COMPANIES.find(x => x.id === current.company);
  // The cost chart is the main page; inside a company, its work comes first.
  document.getElementById("cost").style.display = c ? "none" : "";
  if (!c) { el.innerHTML = '<div class="empty-hint">בחרי חברה</div>'; return; }
  if (!c.tabs) {
    let body = placeholder("💰", "כאן יופיע הטיפול בשכר של החברה.");
    if (c.sheet) {
      el.innerHTML = `<div class="panel"><div class="panel-title"><button class="back-btn" onclick="selectCompany(null)">→ חזרה</button>${escapeHtml(c.name)}</div><div id="sheetRoot"></div></div>`;
      Sheet.open(c);
      return;
    }
    el.innerHTML = `<div class="panel"><div class="panel-title"><button class="back-btn" onclick="selectCompany(null)">→ חזרה</button>${escapeHtml(c.name)}</div>${body}</div>`;
    return;
  }
  const tab = TABS.find(t => t.id === current.tab) || TABS[0];
  el.innerHTML = `<div class="panel">
    <div class="panel-title"><button class="back-btn" onclick="selectCompany(null)">→ חזרה</button>${escapeHtml(c.name)}</div>
    <div class="tabs">${TABS.map(t => `<button class="tab ${t.id === tab.id ? "active" : ""}" data-tab="${t.id}">${t.icon} ${t.label}</button>`).join("")}</div>
    <div id="tabBody">${placeholder(tab.icon, tab.text)}</div>
  </div>`;
  el.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { current.tab = b.dataset.tab; save(); renderContent(); }));
}

function selectCompany(id) {
  current.company = id;
  save();
  renderCompanies();
  renderContent();
}

// Remember the last company/tab for this viewer only.
function save() { try { localStorage.setItem("salary.view", JSON.stringify(current)); } catch (e) {} }
try { Object.assign(current, JSON.parse(localStorage.getItem("salary.view") || "{}")); } catch (e) {}


// ---- Monthly work sheet (רמי מרדכיב) ---------------------------------------
// Same columns as Kateryna's own monthly Excel (one block per branch). Every
// cell is editable; changes auto-save to /api/salary/sheet. Import reads her
// workbook (a month's sheet), export writes the same layout back out.
const SHEET_COLS = [
  { k: "name", src: 0, label: "שם העובד", w: 150 },
  { k: "num", src: 1, label: "מספר עובד", w: 58, num: true },
  { k: "id", src: 2, label: "ת.ז", w: 92, num: true },
  { k: "start", src: 3, label: "תחילת עבודה", w: 88, num: true },
  { k: "pension", src: 4, label: "פנסיה", w: 175 },
  { k: "rate", src: 5, label: "שעתי", w: 86 },
  { k: "price", src: 6, label: "מחיר לשעה", w: 62, num: true },
  { k: "h100", src: 7, label: "100%", x: 1, w: 58, num: true },
  { k: "h125", src: 8, label: "125%", x: 1.25, w: 52, num: true },
  { k: "h150", src: 9, label: "150%", x: 1.5, w: 52, num: true },
  { k: "days", src: 11, label: "ימי עבודה", w: 50, num: true },
  { k: "holidays", src: 12, label: "ימי חג", w: 46, num: true },
  { k: "vacation", src: 13, label: "חופשה", w: 46, num: true },
  { k: "travel", src: 14, label: "נסיעות", w: 56, num: true },
  { k: "bonus", src: 15, label: "בונוס", w: 52, num: true },
  { k: "total", src: 16, label: 'סה"כ', w: 64, num: true },
  { k: "advance", src: 17, label: "מפרעה", w: 56, num: true },
  // Column U of her workbook: loans from the company and their instalments.
  { k: "loan", src: 20, label: "הלוואה מהחברה", w: 220 },
  { k: "notes", src: 18, label: "הערות", w: 260 },
];
// `src` is the column's position in her workbook; its 200% column (10) was
// dropped at her request (2026-11-22) and is skipped on import.
// Columns carried over when starting a month from the previous one.
const KEEP_ON_COPY = ["name", "num", "id", "start", "pension", "rate", "price", "notes", "loan", "pensionAuto"];
const HE_MONTHS = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

const Sheet = {
  company: null, month: null, data: null, template: null, months: [], timer: null,

  async open(c) {
    this.company = c;
    if (!this.month) {
      const d = new Date();
      this.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      try { this.month = localStorage.getItem("salary.sheetMonth") || this.month; } catch (e) {}
    }
    await this.load();
  },

  emptyData() {
    const branches = {};
    this.company.branches.forEach(b => { branches[b.key] = []; });
    return { branches };
  },

  async load() {
    const root = document.getElementById("sheetRoot");
    if (!root) return;
    root.innerHTML = '<div class="save-state">טוען...</div>';
    try {
      const res = await fetch(`/api/salary/sheet?company=${this.company.id}&month=${this.month}`);
      if (!res.ok) throw new Error(await res.text());
      const j = await res.json();
      this.months = j.months || [];
      this.template = null;
      this.data = j.data || await this.templateFromPrev();
    } catch (e) {
      this.data = this.emptyData();
      this.loadError = String(e.message || e);
    }
    this.company.branches.forEach(b => { if (!this.data.branches[b.key]) this.data.branches[b.key] = []; });
    this.fillPension();
    this.render();
  },

  // Pension (Kateryna 2026-11-22): rows marked "ילד" (or anything else she
  // wrote) are left alone; an empty cell gets the date pension starts --
  // six months after the start of work. Such auto cells carry pensionAuto
  // and are recomputed when the start date or the month changes; typing in
  // the cell makes it hers.
  startDate(v) {
    const t = String(v || "").trim();
    let m = t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);
    if (m) {
      const y = Number(m[3]) < 100 ? 2000 + Number(m[3]) : Number(m[3]);
      return new Date(y, Number(m[2]) - 1, Number(m[1]));
    }
    const mi = HE_MONTHS.findIndex(n => t === n || t.startsWith(n + " "));
    if (mi < 0) return null;
    const ym = t.match(/(\d{4})/);
    const [sy, sm] = this.month.split("-").map(Number);
    const y = ym ? Number(ym[1]) : (mi + 1 > sm ? sy - 1 : sy);
    return new Date(y, mi, 1);
  },
  pensionText(start) {
    const d = this.startDate(start);
    if (!d) return null;
    const p = new Date(d.getFullYear(), d.getMonth() + 6, d.getDate());
    const pad = n => String(n).padStart(2, "0");
    const txt = `פנסיה מ-${pad(p.getDate())}/${pad(p.getMonth() + 1)}/${p.getFullYear()}`;
    const [sy, sm] = this.month.split("-").map(Number);
    return p <= new Date(sy, sm, 0) ? txt + " ⚠ להתחיל" : txt;
  },
  fillPension() {
    Object.values(this.data.branches).forEach(rows => rows.forEach(r => this.fillPensionRow(r)));
  },
  fillPensionRow(r) {
    const empty = r.pension == null || String(r.pension).trim() === "";
    if (!empty && !r.pensionAuto) return;
    const txt = this.pensionText(r.start);
    if (txt) { r.pension = txt; r.pensionAuto = true; }
    else if (r.pensionAuto) { delete r.pension; delete r.pensionAuto; }
  },

  // A month with nothing saved starts from the latest earlier saved month:
  // same employees and notes, no hours. Saved on the first edit.
  async templateFromPrev() {
    const prev = this.months.filter(m => m < this.month).pop();
    if (!prev) return this.emptyData();
    const res = await fetch(`/api/salary/sheet?company=${this.company.id}&month=${prev}`);
    const j = res.ok ? await res.json() : {};
    if (!j.data) return this.emptyData();
    this.template = prev;
    return this.keepColumns(j.data);
  },
  keepColumns(data) {
    const out = this.emptyData();
    Object.entries(data.branches || {}).forEach(([k, rows]) => {
      out.branches[k] = rows.map(r => Object.fromEntries(KEEP_ON_COPY.filter(f => r[f] != null).map(f => [f, r[f]])));
    });
    return out;
  },
  branchKeys() {
    return [...this.company.branches.map(b => b.key),
            ...Object.keys(this.data.branches).filter(k => !this.company.branches.some(b => b.key === k))];
  },
  branchLabel(k) { const b = this.company.branches.find(x => x.key === k); return b ? b.label : k; },

  monthName(m) { const [y, mo] = m.split("-").map(Number); return `${HE_MONTHS[mo - 1]} ${y}`; },

  render() {
    const root = document.getElementById("sheetRoot");
    if (!root) return;
    const saved = this.months.includes(this.month);
    const total = Object.values(this.data.branches).reduce((n, r) => n + r.length, 0);
    const ncol = SHEET_COLS.length + 1;
    const state = this.loadError ? "שגיאה בטעינה: " + escapeHtml(this.loadError)
      : saved ? "שמור ✓"
      : this.template ? `תבנית מ${escapeHtml(this.monthName(this.template))} — יישמר בעריכה הראשונה`
      : "חודש חדש — עדיין ריק";
    const body = this.branchKeys().map(k => {
      const rows = this.data.branches[k] || [];
      return `<tr class="branch-row"><td colspan="${ncol}">📍 ${escapeHtml(this.branchLabel(k))} (${rows.length})
          <button class="sbtn small" data-add="${escapeHtml(k)}">+ הוסף עובד</button></td></tr>
        ${rows.map((r, i) => `<tr>${SHEET_COLS.map(c =>
            `<td class="${c.num ? "num" : ""}"><input data-b="${escapeHtml(k)}" data-row="${i}" data-k="${c.k}" value="${escapeHtml(r[c.k] ?? "")}"></td>`).join("")}
            <td><button class="del-row" data-b="${escapeHtml(k)}" data-del="${i}" title="מחיקת שורה">✕</button></td></tr>`).join("")
          || `<tr><td colspan="${ncol}" style="padding:10px;text-align:center;color:var(--muted)">אין עובדים בסניף הזה</td></tr>`}`;
    }).join("");
    root.innerHTML = `
      <div class="sheet-bar">
        <label>חודש: <input type="month" id="sheetMonth" value="${this.month}"></label>
        <button class="sbtn" id="btnImport">⬆ ייבוא מאקסל</button>
        <button class="sbtn" id="btnCopyPrev">העתק עובדים מחודש קודם</button>
        <button class="sbtn primary" id="btnExport">⬇ הורדת אקסל</button>
        <span class="save-state ${this.loadError ? "err" : ""}" id="saveState">${state}</span>
        <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none">
      </div>
      <div id="pickSheet"></div>
      <div class="sheet-wrap"><table class="sheet">
        <thead><tr>${SHEET_COLS.map(c => `<th style="min-width:${c.w}px">${c.label}</th>`).join("")}<th></th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      <div class="sheet-foot">
        <span>${total} עובדים · ${escapeHtml(this.monthName(this.month))}</span>
      </div>`;
    root.querySelector("#sheetMonth").addEventListener("change", e => {
      if (!e.target.value) return;
      this.month = e.target.value;
      try { localStorage.setItem("salary.sheetMonth", this.month); } catch (err) {}
      this.load();
    });
    root.querySelectorAll("input[data-k]").forEach(inp => inp.addEventListener("input", () => {
      const row = this.data.branches[inp.dataset.b][Number(inp.dataset.row)];
      row[inp.dataset.k] = inp.value;
      if (inp.dataset.k === "pension") delete row.pensionAuto;
      if (inp.dataset.k === "start" || (inp.dataset.k === "pension" && !inp.value.trim())) {
        this.fillPensionRow(row);
        const pin = root.querySelector(`input[data-k="pension"][data-b="${CSS.escape(inp.dataset.b)}"][data-row="${inp.dataset.row}"]`);
        if (pin && pin !== inp) pin.value = row.pension ?? "";
      }
      this.scheduleSave();
    }));
    root.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
      const r = this.data.branches[b.dataset.b][Number(b.dataset.del)];
      if (!confirm(`למחוק את השורה${r && r.name ? " של " + r.name : ""}?`)) return;
      this.data.branches[b.dataset.b].splice(Number(b.dataset.del), 1);
      this.saveNow(); this.render();
    }));
    root.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.add;
      (this.data.branches[k] = this.data.branches[k] || []).push({});
      this.saveNow(); this.render();
      const inputs = root.querySelectorAll(`input[data-k="name"][data-b="${CSS.escape(k)}"]`);
      if (inputs.length) inputs[inputs.length - 1].focus();
    }));
    root.querySelector("#btnExport").addEventListener("click", () => this.exportXlsx());
    root.querySelector("#btnCopyPrev").addEventListener("click", () => this.copyPrev());
    const file = root.querySelector("#importFile");
    root.querySelector("#btnImport").addEventListener("click", () => file.click());
    file.addEventListener("change", () => { if (file.files[0]) this.importXlsx(file.files[0]); });
  },

  setState(text, err) {
    const el = document.getElementById("saveState");
    if (el) { el.textContent = text; el.classList.toggle("err", !!err); }
  },
  scheduleSave() {
    this.setState("שומר...");
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.saveNow(), 700);
  },
  async saveNow() {
    clearTimeout(this.timer);
    try {
      const res = await fetch("/api/salary/sheet", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ company: this.company.id, month: this.month, data: this.data }),
      });
      if (!res.ok) throw new Error(await res.text());
      if (!this.months.includes(this.month)) this.months.push(this.month);
      this.setState("נשמר ✓");
    } catch (e) {
      this.setState("שגיאה בשמירה: " + (e.message || e), true);
    }
  },

  hasData() { return Object.values(this.data.branches).some(r => r.length); },

  async copyPrev() {
    const [y, m] = this.month.split("-").map(Number);
    const d = new Date(y, m - 2, 1);
    const prev = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const res = await fetch(`/api/salary/sheet?company=${this.company.id}&month=${prev}`);
    const j = res.ok ? await res.json() : {};
    if (!j.data) { alert(`אין נתונים שמורים ל${this.monthName(prev)}`); return; }
    if (this.hasData() && !confirm(`בחודש ${this.monthName(this.month)} כבר יש נתונים. להחליף ברשימת העובדים מ${this.monthName(prev)} (בלי שעות)?`)) return;
    this.data = this.keepColumns(j.data); this.fillPension(); this.template = null; this.saveNow(); this.render();
  },

  // ---- Excel import: one month's sheet of her workbook -----------------
  importXlsx(file) {
    const reader = new FileReader();
    reader.onload = e => {
      let wb;
      try { wb = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: true }); }
      catch (err) { alert("לא הצלחתי לקרוא את הקובץ: " + err.message); return; }
      const want = HE_MONTHS[Number(this.month.split("-")[1]) - 1];
      const match = wb.SheetNames.find(n => n.trim() === want);
      const pick = document.getElementById("pickSheet");
      pick.innerHTML = `<div class="pick-sheet">ייבוא לחודש ${escapeHtml(this.monthName(this.month))} מהגיליון:
        <select id="sheetSel">${wb.SheetNames.map((n, i) => `<option value="${i}" ${n === match ? "selected" : ""}>${escapeHtml(n)}</option>`).join("")}</select>
        <button class="sbtn primary" id="doImport">ייבא</button><button class="sbtn" id="cancelImport">ביטול</button></div>`;
      pick.querySelector("#cancelImport").onclick = () => { pick.innerHTML = ""; };
      pick.querySelector("#doImport").onclick = () => {
        // By index: sheet names can end in a space ("אוקטובר "), which an
        // option's text value would lose.
        const parsed = this.parseSheet(wb.Sheets[wb.SheetNames[Number(pick.querySelector("#sheetSel").value)]]);
        const count = Object.values(parsed.branches).reduce((s, r) => s + r.length, 0);
        if (!count) { alert("לא נמצאו עובדים בגיליון הזה"); return; }
        if (this.hasData() && !confirm(`להחליף את הנתונים של ${this.monthName(this.month)} ב-${count} עובדים מהקובץ?`)) return;
        this.data = parsed; this.fillPension(); pick.innerHTML = ""; this.saveNow(); this.render();
      };
    };
    reader.readAsArrayBuffer(file);
    document.getElementById("importFile").value = "";
  },

  fmtCell(v) {
    if (v == null) return "";
    if (v instanceof Date) {
      const p = n => String(n).padStart(2, "0");
      return `${p(v.getDate())}/${p(v.getMonth() + 1)}/${v.getFullYear()}`;
    }
    if (typeof v === "number") return String(Math.round(v * 100) / 100);
    return String(v).trim();
  },

  // Blocks: a branch title row, then a "שם העובד" header row, then employees.
  // Columns are positional, as in her file (A..R, notes from S onward).
  parseSheet(ws) {
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
    const out = this.emptyData();
    let branch = null;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i] || [];
      const first = this.fmtCell(r[0]);
      const next = rows[i + 1] || [];
      if (first && this.fmtCell(next[0]) === "שם העובד") { branch = this.branchKey(first, out); continue; }
      if (first === "שם העובד" || !branch || !first) continue;
      const row = {};
      SHEET_COLS.forEach(c => {
        const idx = c.src;
        if (c.k === "notes") {
          const taken = new Set(SHEET_COLS.map(x => x.src));
          const notes = r.slice(idx).filter((v, j) => j === 0 || !taken.has(idx + j))
            .map(v => this.fmtCell(v)).filter(Boolean);
          if (notes.length) row.notes = notes.join(" | ");
        } else {
          const v = this.fmtCell(r[idx]);
          if (v !== "") row[c.k] = v;
        }
      });
      out.branches[branch].push(row);
    }
    return out;
  },
  branchKey(title, out) {
    const t = title.trim();
    const known = this.company.branches.find(b => b.key === t)
      || this.company.branches.find(b => t.includes("מפגש") ? b.key.includes("מפגש") : b.key === t);
    const key = known ? known.key : t;
    if (!out.branches[key]) out.branches[key] = [];
    return key;
  },

  // ---- Excel export: same layout as her workbook ------------------------
  exportXlsx() {
    const toCell = (c, v) => {
      if (v == null || v === "") return null;
      if (c.num && /^-?\d+(\.\d+)?$/.test(String(v).trim())) return Number(v);
      return v;
    };
    const aoa = [];
    this.branchKeys().forEach(k => {
      aoa.push([k]);
      aoa.push(SHEET_COLS.map(c => c.x ?? c.label));
      (this.data.branches[k] || []).forEach(r => aoa.push(SHEET_COLS.map(c => toCell(c, r[c.k]))));
      aoa.push([]);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = SHEET_COLS.map(c => ({ wch: Math.max(6, Math.round(c.w / 7)) }));
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.utils.book_append_sheet(wb, ws, HE_MONTHS[Number(this.month.split("-")[1]) - 1]);
    XLSX.writeFile(wb, `שכר_${this.company.id === "rami" ? "רמי_מרדכיב" : this.company.id}_${this.month}.xlsx`);
  },
};

// ---- Salary cost vs last month ------------------------------------------
// SAMPLE DATA ONLY (Kateryna 2026-11-22: "שיקח נתונים בהמשך") -- shows how
// the chart will look; replace with real monthly totals per company once
// the payroll data source is connected. Gross salary cost, ₪.
const SAMPLE_COST = {
  months: ["06/2026", "07/2026", "08/2026", "09/2026", "10/2026", "11/2026"],
  byCompany: {
    abt:  [182000, 176500, 191200, 188400, 193800, 201300],
    ubr:  [96500,  98200,  94100,  101700, 99300,  97600],
    bui:  [54200,  56800,  55100,  53900,  57400,  61200],
    aa:   [31800,  30900,  33200,  32600,  31100,  30400],
    rami: [27400,  28100,  27900,  28800,  29300,  29300],
  },
};

function shekel(n) { return "₪" + Math.round(n).toLocaleString("he-IL"); }
function change(now, before) {
  if (!before) return '<span class="chg flat">—</span>';
  const pct = (now - before) / before * 100;
  if (Math.abs(pct) < 0.5) return '<span class="chg flat">= 0%</span>';
  // Salary cost going up is shown red, down green.
  return `<span class="chg ${pct > 0 ? "up" : "down"}">${pct > 0 ? "▲" : "▼"} ${Math.abs(pct).toFixed(1)}%</span>`;
}

function renderCost() {
  const data = SAMPLE_COST;
  const n = data.months.length;
  const totals = data.months.map((_, i) => COMPANIES.reduce((s, c) => s + (data.byCompany[c.id]?.[i] || 0), 0));
  const now = totals[n - 1], prev = totals[n - 2];
  const rows = COMPANIES.map(c => ({ c, now: data.byCompany[c.id][n - 1], prev: data.byCompany[c.id][n - 2] }))
    .sort((a, b) => b.now - a.now);
  const max = Math.max(...rows.map(r => Math.max(r.now, r.prev)));
  const tmax = Math.max(...totals);
  document.getElementById("cost").innerHTML = `
    <div class="cost-head">
      <span class="cost-title">עלות שכר — ${data.months[n - 1]} מול ${data.months[n - 2]}</span>
      <span class="sample-tag">נתוני דוגמה — הנתונים האמיתיים יחוברו בהמשך</span>
    </div>
    <div class="tiles">
      <div class="tile"><div class="label">סה"כ עלות שכר החודש</div><div class="value">${shekel(now)}</div></div>
      <div class="tile"><div class="label">חודש קודם</div><div class="value">${shekel(prev)}</div></div>
      <div class="tile"><div class="label">שינוי</div><div class="value">${change(now, prev)}</div></div>
    </div>
    <div class="legend"><span><i style="background:var(--blue)"></i>החודש</span><span><i style="background:#b9cbe0"></i>חודש קודם</span></div>
    ${rows.map(r => `<div class="row">
      <span class="name" title="${escapeHtml(r.c.name)}">${escapeHtml(r.c.name)}</span>
      <span class="bars">
        <span class="bar now" style="width:${r.now / max * 100}%" data-tip="${escapeHtml(r.c.name)} · החודש · ${shekel(r.now)}"></span>
        <span class="bar prev" style="width:${r.prev / max * 100}%" data-tip="${escapeHtml(r.c.name)} · חודש קודם · ${shekel(r.prev)}"></span>
      </span>
      <span class="val">${shekel(r.now)}</span>
      ${change(r.now, r.prev)}
    </div>`).join("")}
    <div class="trend-caption">סה"כ עלות שכר — 6 חודשים אחרונים</div>
    <div class="trend">${totals.map((t, i) => `<div class="trend-col">
      <div class="trend-bar ${i === n - 1 ? "last" : ""}" style="height:${Math.max(t / tmax * 80, 4)}px" data-tip="${data.months[i]} · ${shekel(t)}"></div>
      <span class="trend-lbl">${data.months[i]}</span></div>`).join("")}</div>`;
  const tip = document.getElementById("tooltip");
  document.querySelectorAll("#cost [data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => {
      tip.textContent = el.dataset.tip; tip.style.display = "block";
      tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
    });
    el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

renderCompanies();
renderCost();
renderContent();
