<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מנהלת חשבונות</title>
<style>
  :root {
    --blue-dark: #0b4f8a; --blue: #1e6fb8; --blue-light: #eaf3fb;
    --border: #d9e6f0; --text: #1c2b39; --muted: #5b7186; --red: #d92b2b;
    --amber: #a86a00; --green: #1a8a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f4f8fb; color: var(--text); padding: 22px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
  .top h2 { margin: 0; color: var(--blue-dark); font-size: 19px; }
  .filters {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  select, input[type=date] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff;
  }
  label.f { font-size: 13px; color: var(--muted); }
  .btn {
    background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 8px 14px;
    font-size: 14px; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .btn:hover { background: var(--blue-dark); }
  .btn.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  .summary { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .summary strong { color: var(--blue-dark); }

  .supplier {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 16px; overflow: hidden; break-inside: avoid;
  }
  .supplier-head {
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;
    background: var(--blue-light); padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .supplier-name { font-weight: 700; font-size: 15.5px; color: var(--blue-dark); }
  .supplier-email { font-size: 13px; color: var(--muted); direction: ltr; }
  .supplier-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .credit-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--muted); background: #fff;
    color: var(--muted); border-radius: 14px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .credit-btn.waiting { border: 1px solid var(--red); color: var(--red); font-weight: 700; }
  .red-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; flex-shrink: 0; }
  .credit-panel { background: #fff7f7; border-bottom: 1px solid var(--border); padding: 10px 16px; }
  .credit-panel table { font-size: 13px; }
  .credit-panel th, .credit-panel td { padding: 5px 8px; }
  .credit-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .credit-form select, .credit-form input {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff;
  }
  .credit-form input.amount { width: 110px; }
  .credit-form input.note { flex: 1; min-width: 140px; }
  .mini-btn {
    border: 1px solid var(--blue); background: #fff; color: var(--blue); border-radius: 6px;
    padding: 3px 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .mini-btn.go { background: var(--blue); color: #fff; }
  .mini-btn.ok { border-color: var(--green); color: var(--green); }
  .mini-btn.del { border-color: transparent; color: var(--muted); }
  .credits-banner {
    background: #fff; border: 1px solid var(--red); border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .credits-banner a { color: var(--red); font-weight: 600; cursor: pointer; text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: right; color: var(--muted); font-weight: 600; padding: 7px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: left; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.credit td { color: var(--amber); }
  tr.total td { font-weight: 700; background: #f8fafc; border-bottom: none; }
  tr.paid-sum td { color: var(--green); font-weight: 600; background: #f8fafc; border-bottom: none; padding-top: 2px; }
  tr.paid td { color: var(--muted); }
  tr.paid td.num { text-decoration: line-through; }
  .pay-btn {
    border: 1px solid var(--blue); background: #fff; color: var(--blue); border-radius: 6px;
    padding: 3px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .pay-btn.done { background: var(--green); border-color: var(--green); color: #fff; }
  .pay-print { display: none; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: #fff4e0; color: var(--amber); font-weight: 600; }
  .company-picker {
    padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 12.5px; font-family: inherit; background: #fff; max-width: 200px;
  }
  .company-picker.unset { border-color: var(--red); color: var(--red); }
  .company-print { display: none; }
  .grand {
    background: #fff; border: 2px solid var(--blue); border-radius: 10px;
    padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
    font-size: 16px; font-weight: 700; color: var(--blue-dark); flex-wrap: wrap; gap: 8px;
  }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .print-title { display: none; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    th, td { padding: 6px 8px; }
    .table-wrap { overflow-x: auto; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .filters, .top .actions { display: none; }
    .print-title { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .company-picker { display: none; }
    .company-print { display: inline; }
    .pay-btn { display: none; }
    .credit-form, .mini-btn, .credits-banner { display: none; }
    .pay-print { display: inline; }
    .supplier { border-color: #999; }
  }
</style>
</head>
<body>
  <div class="top">
    <h2>🧾 מנהלת חשבונות — חשבוניות שטופלו, לתשלום לפי ספק</h2>
    <div class="actions">
      <button class="btn secondary" onclick="window.print()">🖨️ הדפסה</button>
      <button class="btn secondary" onclick="exportExcel()">⬇️ אקסל</button>
    </div>
  </div>

  <div class="filters">
    <label class="f">חברה לחיוב:
      <select id="companyFilter" onchange="render()"></select>
    </label>
    <label class="f">ספק:
      <select id="supplierFilter" onchange="render()"><option value="">כל הספקים</option></select>
    </label>
    <label class="f">תשלום:
      <select id="paidFilter" onchange="render()">
        <option value="">הכל</option>
        <option value="unpaid">לא שולם</option>
        <option value="paid">שולם</option>
      </select>
    </label>
    <label class="f">מתאריך: <input type="date" id="dateFrom" onchange="render()"></label>
    <label class="f">עד תאריך: <input type="date" id="dateTo" onchange="render()"></label>
    <button class="btn secondary" onclick="setThisMonth()">החודש</button>
    <button class="btn secondary" onclick="setLastMonth()">חודש קודם</button>
    <button class="btn secondary" onclick="clearFilters()">נקה</button>
  </div>

  <div id="creditsBanner"></div>
  <div class="print-title" id="printTitle"></div>
  <div class="summary" id="summary"></div>
  <div id="suppliers"></div>
  <div id="grand"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Same flat VAT rate as /inventory -- stored line_items totals are ללא מע"מ.
const VAT_RATE = 0.18;
const NO_COMPANY = "__none__";

let RECORDS = [];
// Open "מחכה לזיכוי" entries (pending_credits rows not yet received).
let CREDITS = [];
const openCreditPanels = new Set();
let CURRENT_GROUPS = [];
let SUPPLIER_NAMES = {};
let COMPANIES = [];

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(n) {
  return "₪" + n.toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function dateStr(r) {
  if (!r.received_at) return "";
  const d = new Date(r.received_at);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function displayDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
// A זיכוי reduces what's owed, whatever sign its parser gave the lines.
function amount(r) {
  let total = 0;
  (r.line_items || []).forEach(it => { total += Number(it.total) || 0; });
  return r.is_credit ? -Math.abs(total) : total;
}
function supplierName(domain) {
  return SUPPLIER_NAMES[domain] || domain || "— ללא ספק —";
}

function populateFilters() {
  const companySel = document.getElementById("companyFilter");
  companySel.innerHTML = '<option value="">כל החברות</option>' +
    COMPANIES.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("") +
    `<option value="${NO_COMPANY}">— ללא חברה —</option>`;
  const supplierSel = document.getElementById("supplierFilter");
  const domains = [...new Set(RECORDS.map(r => r.supplier_domain).filter(Boolean))]
    .sort((a, b) => supplierName(a).localeCompare(supplierName(b), "he"));
  supplierSel.innerHTML = '<option value="">כל הספקים</option>' +
    domains.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(supplierName(d))}</option>`).join("");
}

function filtered() {
  const company = document.getElementById("companyFilter").value;
  const supplier = document.getElementById("supplierFilter").value;
  const from = document.getElementById("dateFrom").value;
  const to = document.getElementById("dateTo").value;
  const paid = document.getElementById("paidFilter").value;
  return RECORDS.filter(r => {
    if (paid === "paid" && !r.paid_at) return false;
    if (paid === "unpaid" && r.paid_at) return false;
    if (company === NO_COMPANY ? r.company : (company && r.company !== company)) return false;
    if (supplier && r.supplier_domain !== supplier) return false;
    const d = dateStr(r);
    if (from && (!d || d < from)) return false;
    if (to && (!d || d > to)) return false;
    return true;
  });
}

// One block per supplier: name + email on the header line, its invoices
// below, and the supplier's total to pay at the bottom.
function groups(records) {
  const map = new Map();
  records.forEach(r => {
    const key = r.supplier_domain || "";
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });
  return [...map.entries()]
    .map(([domain, rows]) => {
      rows.sort((a, b) => dateStr(a).localeCompare(dateStr(b)));
      // Most recent sender address for this supplier.
      const email = [...rows].reverse().map(r => r.sender_email).find(Boolean) || "";
      // total = still to pay; invoices marked שולם move to paidTotal.
      const total = rows.filter(r => !r.paid_at).reduce((s, r) => s + amount(r), 0);
      const paidTotal = rows.filter(r => r.paid_at).reduce((s, r) => s + amount(r), 0);
      return { domain, name: supplierName(domain), email: cleanEmail(email), rows, total, paidTotal };
    })
    .sort((a, b) => a.name.localeCompare(b.name, "he"));
}
// "Name <addr@x>" -> "addr@x"
function cleanEmail(s) {
  const m = String(s).match(/<([^>]+)>/);
  return (m ? m[1] : s).trim();
}

function companyCell(r) {
  const opts = COMPANIES.map(c => `<option value="${escapeHtml(c)}" ${c === r.company ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
  return `<select class="company-picker ${r.company ? "" : "unset"}" data-id="${r.id}" onchange="setCompany(this)">
      <option value="">— לבחור —</option>${opts}
    </select><span class="company-print">${escapeHtml(r.company || "")}</span>`;
}

function render() {
  const records = filtered();
  const gs = groups(records);
  const grandExcl = gs.reduce((s, g) => s + g.total, 0);
  const grandPaid = gs.reduce((s, g) => s + g.paidTotal, 0);

  const companyVal = document.getElementById("companyFilter").value;
  const companyLabel = companyVal === NO_COMPANY ? "ללא חברה" : (companyVal || "כל החברות");
  const from = document.getElementById("dateFrom").value, to = document.getElementById("dateTo").value;
  const range = from || to ? ` · ${displayDate(from) || "…"} – ${displayDate(to) || "…"}` : "";
  document.getElementById("printTitle").textContent = `חברה: ${companyLabel}${range}`;

  document.getElementById("summary").innerHTML = records.length
    ? `${gs.length} ספקים · ${records.length} חשבוניות · חברה: <strong>${escapeHtml(companyLabel)}</strong>${escapeHtml(range)}`
    : "";

  renderCreditsBanner();
  CURRENT_GROUPS = gs;
  const el = document.getElementById("suppliers");
  if (!records.length) {
    el.innerHTML = '<div class="empty">אין חשבוניות שטופלו בטווח ובסינון שנבחרו.</div>';
    document.getElementById("grand").innerHTML = "";
    return;
  }
  el.innerHTML = gs.map((g, gi) => `
    <div class="supplier">
      <div class="supplier-head">
        <span class="supplier-title">
          <span class="supplier-name">${escapeHtml(g.name)}</span>
          ${creditButton(g.domain, gi)}
        </span>
        <span class="supplier-email">${escapeHtml(g.email)}</span>
      </div>
      ${openCreditPanels.has(g.domain) ? creditPanel(g.domain, gi) : ""}
      <div class="table-wrap">
      <table>
        <thead><tr>
          <th>מס' חשבונית</th><th>תאריך</th><th>סניף</th><th>חברה</th>
          <th class="num">ללא מע"מ</th><th class="num">כולל מע"מ</th><th>שולם</th>
        </tr></thead>
        <tbody>
          ${g.rows.map(r => {
            const a = amount(r);
            return `<tr class="${r.is_credit ? "credit" : ""} ${r.paid_at ? "paid" : ""}">
              <td>${escapeHtml(r.invoice_number || "—")} ${r.is_credit ? '<span class="tag">זיכוי</span>' : ""}${
                CREDITS.some(c => c.supplier_domain === r.supplier_domain && c.invoice_number && c.invoice_number === r.invoice_number)
                  ? ' <span class="red-dot" title="מחכה לזיכוי עבור חשבונית זו"></span>' : ""}</td>
              <td>${escapeHtml(displayDate(dateStr(r)))}</td>
              <td>${escapeHtml(r.branch || "")}</td>
              <td>${companyCell(r)}</td>
              <td class="num">${money(a)}</td>
              <td class="num">${money(a * (1 + VAT_RATE))}</td>
              <td>${payCell(r)}</td>
            </tr>`;
          }).join("")}
          <tr class="total">
            <td colspan="4">סה"כ לתשלום — ${escapeHtml(g.name)}</td>
            <td class="num">${money(g.total)}</td>
            <td class="num">${money(g.total * (1 + VAT_RATE))}</td>
            <td></td>
          </tr>
          ${g.paidTotal ? `<tr class="paid-sum">
            <td colspan="4">✓ כבר שולם</td>
            <td class="num">${money(g.paidTotal)}</td>
            <td class="num">${money(g.paidTotal * (1 + VAT_RATE))}</td>
            <td></td>
          </tr>` : ""}
        </tbody>
      </table>
      </div>
    </div>`).join("");

  document.getElementById("grand").innerHTML = `
    <div class="grand">
      <span>סה"כ לתשלום (כל הספקים)</span>
      <span>${money(grandExcl * (1 + VAT_RATE))} <small style="font-weight:500;color:var(--muted);font-size:13px;">(ללא מע"מ ${money(grandExcl)})</small></span>
    </div>
    ${grandPaid ? `<div class="summary" style="margin-top:8px;color:var(--green);">✓ כבר שולם בסינון הנוכחי: <strong style="color:var(--green)">${money(grandPaid * (1 + VAT_RATE))}</strong> (ללא מע"מ ${money(grandPaid)}) — לא נכלל בסה"כ לתשלום</div>` : ""}`;
}

// ---- מחכה לזיכוי -------------------------------------------------------
function creditsFor(domain) {
  return CREDITS.filter(c => c.supplier_domain === domain);
}

function creditButton(domain, gi) {
  const n = creditsFor(domain).length;
  return n
    ? `<button class="credit-btn waiting" onclick="toggleCredits(${gi})"><span class="red-dot"></span>מחכה לזיכוי${n > 1 ? ` (${n})` : ""}</button>`
    : `<button class="credit-btn" onclick="toggleCredits(${gi})">+ מחכה לזיכוי</button>`;
}

function creditPanel(domain, gi) {
  const list = creditsFor(domain);
  // Every handled invoice of this supplier, whatever the date filter, so a
  // credit can be tied to an older invoice too.
  const invoices = RECORDS.filter(r => r.supplier_domain === domain && r.invoice_number)
    .sort((a, b) => dateStr(b).localeCompare(dateStr(a)));
  const rows = list.map(c => `
    <tr>
      <td>${escapeHtml(c.invoice_number || "—")}</td>
      <td class="num">${c.amount != null ? money(c.amount) : "—"}</td>
      <td>${escapeHtml(c.note || "")}</td>
      <td>${escapeHtml(displayDate(String(c.created_at).slice(0, 10)))}</td>
      <td style="white-space:nowrap">
        <button class="mini-btn ok" onclick="creditReceived(${c.id})">✓ קיבלתי את הזיכוי</button>
        <button class="mini-btn del" title="מחיקה" onclick="creditDelete(${c.id})">✕</button>
      </td>
    </tr>`).join("");
  return `<div class="credit-panel">
    ${list.length ? `<table>
      <thead><tr><th>זיכוי עבור חשבונית</th><th class="num">סכום</th><th>הערה</th><th>נרשם</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : '<div class="summary" style="margin:0">אין זיכויים ממתינים לספק הזה.</div>'}
    <div class="credit-form">
      <select id="creditInvoice-${gi}">
        <option value="">— חשבונית —</option>
        ${invoices.map(r => `<option value="${escapeHtml(r.invoice_number)}">${escapeHtml(r.invoice_number)} · ${escapeHtml(displayDate(dateStr(r)))}</option>`).join("")}
      </select>
      <input class="amount" id="creditAmount-${gi}" type="number" step="0.01" placeholder="סכום (לא חובה)">
      <input class="note" id="creditNote-${gi}" type="text" placeholder="הערה — למשל: מוצר פגום, חוסר במשלוח">
      <button class="mini-btn go" onclick="creditAdd(${gi})">+ הוסף זיכוי ממתין</button>
    </div>
  </div>`;
}

function toggleCredits(gi) {
  const domain = CURRENT_GROUPS[gi].domain;
  if (openCreditPanels.has(domain)) openCreditPanels.delete(domain); else openCreditPanels.add(domain);
  render();
}

function renderCreditsBanner() {
  const byDomain = new Map();
  CREDITS.forEach(c => byDomain.set(c.supplier_domain, (byDomain.get(c.supplier_domain) || 0) + 1));
  const el = document.getElementById("creditsBanner");
  if (!byDomain.size) { el.innerHTML = ""; return; }
  const links = [...byDomain.entries()].map(([d, n]) =>
    `<a data-domain="${escapeHtml(d)}">${escapeHtml(supplierName(d))}${n > 1 ? ` (${n})` : ""}</a>`).join(" · ");
  el.innerHTML = `<div class="credits-banner"><span class="red-dot"></span><strong>ממתינים לזיכוי:</strong> ${links}</div>`;
  el.querySelectorAll("a[data-domain]").forEach(a => a.addEventListener("click", () => showSupplierCredits(a.dataset.domain)));
}

// From the banner: show that supplier (any date) with its credit table open.
function showSupplierCredits(domain) {
  const sel = document.getElementById("supplierFilter");
  if (![...sel.options].some(o => o.value === domain)) {
    sel.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(domain)}">${escapeHtml(supplierName(domain))}</option>`);
  }
  sel.value = domain;
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  openCreditPanels.add(domain);
  render();
}

async function loadCredits() {
  const res = await fetch("/api/credits/list");
  if (res.ok) CREDITS = await res.json();
}

async function creditAdd(gi) {
  const domain = CURRENT_GROUPS[gi].domain;
  const body = {
    supplier_domain: domain,
    invoice_number: document.getElementById(`creditInvoice-${gi}`).value,
    amount: document.getElementById(`creditAmount-${gi}`).value,
    note: document.getElementById(`creditNote-${gi}`).value,
  };
  if (!body.invoice_number && !body.note) { alert("בחרי חשבונית או כתבי הערה"); return; }
  const res = await fetch("/api/credits/create", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) { alert("שגיאה בשמירה: " + (await res.text())); return; }
  await loadCredits();
  render();
}

async function creditReceived(id) {
  const res = await fetch(`/api/credits/received/${id}`, { method: "POST" });
  if (!res.ok) { alert("שגיאה: " + (await res.text())); return; }
  await loadCredits();
  render();
}

async function creditDelete(id) {
  if (!confirm("למחוק את הרישום הזה?")) return;
  const res = await fetch(`/api/credits/delete/${id}`, { method: "POST" });
  if (!res.ok) { alert("שגיאה: " + (await res.text())); return; }
  await loadCredits();
  render();
}

function payCell(r) {
  const when = r.paid_at ? displayDate(String(r.paid_at).slice(0, 10)) : "";
  return r.paid_at
    ? `<button class="pay-btn done" title="שולם ב-${escapeHtml(when)} — לחיצה מבטלת" onclick="setPaid(${r.id}, false)">✓ שולם</button><span class="pay-print">✓ ${escapeHtml(when)}</span>`
    : `<button class="pay-btn" onclick="setPaid(${r.id}, true)">שולם</button><span class="pay-print">—</span>`;
}

async function setPaid(id, paid) {
  const res = await fetch(`/api/inventory/set-paid/${id}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ paid }),
  });
  if (!res.ok) { alert("שגיאה בשמירה: " + (await res.text())); return; }
  const r = RECORDS.find(x => x.id === id);
  if (r) r.paid_at = paid ? new Date().toISOString() : null;
  render();
}

async function setCompany(sel) {
  const id = Number(sel.dataset.id);
  const company = sel.value;
  const res = await fetch(`/api/inventory/set-company/${id}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ company }),
  });
  if (!res.ok) { alert("שגיאה בשמירת החברה: " + (await res.text())); return; }
  const r = RECORDS.find(x => x.id === id);
  if (r) r.company = company || null;
  render();
}

function exportExcel() {
  const gs = groups(filtered());
  if (!gs.length) { alert("אין נתונים לייצוא"); return; }
  const round2 = n => Math.round(n * 100) / 100;
  const rows = [];
  let grand = 0;
  gs.forEach(g => {
    rows.push([g.name, g.email]);
    rows.push(["מס' חשבונית", "תאריך", "סוג", "סניף", "חברה", 'ללא מע"מ', 'כולל מע"מ', "שולם"]);
    g.rows.forEach(r => {
      const a = amount(r);
      rows.push([r.invoice_number || "", displayDate(dateStr(r)), r.is_credit ? "זיכוי" : "חשבונית",
                 r.branch || "", r.company || "", round2(a), round2(a * (1 + VAT_RATE)),
                 r.paid_at ? displayDate(String(r.paid_at).slice(0, 10)) : ""]);
    });
    rows.push(['סה"כ לתשלום', "", "", "", "", round2(g.total), round2(g.total * (1 + VAT_RATE))]);
    if (g.paidTotal) rows.push(["כבר שולם", "", "", "", "", round2(g.paidTotal), round2(g.paidTotal * (1 + VAT_RATE))]);
    rows.push([]);
    grand += g.total;
  });
  rows.push(['סה"כ לתשלום (כל הספקים)', "", "", "", "", round2(grand), round2(grand * (1 + VAT_RATE))]);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 26 }, { wch: 28 }, { wch: 9 }, { wch: 18 }, { wch: 28 }, { wch: 13 }, { wch: 13 }, { wch: 11 }];
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, "לתשלום");
  XLSX.writeFile(wb, `מנהלת_חשבונות_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

function isoDate(d) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function setThisMonth() {
  const now = new Date();
  document.getElementById("dateFrom").value = isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
  document.getElementById("dateTo").value = isoDate(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  render();
}
function setLastMonth() {
  const now = new Date();
  document.getElementById("dateFrom").value = isoDate(new Date(now.getFullYear(), now.getMonth() - 1, 1));
  document.getElementById("dateTo").value = isoDate(new Date(now.getFullYear(), now.getMonth(), 0));
  render();
}
function clearFilters() {
  ["companyFilter", "supplierFilter", "paidFilter", "dateFrom", "dateTo"].forEach(id => { document.getElementById(id).value = ""; });
  render();
}

(async function init() {
  const [names, companies, report] = await Promise.all([
    fetch("/api/inventory/supplier-names"),
    fetch("/api/inventory/companies"),
    fetch("/api/inventory/report"),
  ]);
  if (names.ok) SUPPLIER_NAMES = await names.json();
  if (companies.ok) COMPANIES = await companies.json();
  if (!report.ok) {
    document.getElementById("suppliers").innerHTML = '<div class="empty">שגיאה בטעינה: ' + escapeHtml(await report.text()) + "</div>";
    return;
  }
  // Only invoices already handled (טופל, status "ok") go to the bookkeeper
  // -- anything still under review isn't confirmed yet (Kateryna 2026-10-26).
  RECORDS = (await report.json()).filter(r => r.status === "ok");
  await loadCredits();
  populateFilters();
  setThisMonth();
})();
</script>
