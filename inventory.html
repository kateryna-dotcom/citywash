<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מלאי</title>
<style>
  :root {
    --blue-dark: #0b4f8a; --blue: #1e6fb8; --blue-light: #eaf3fb;
    --border: #d9e6f0; --text: #1c2b39; --red: #d92b2b; --red-light: #fdecec;
    --green: #1a8a4a; --green-light: #eaf9f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f4f8fb; color: var(--text); padding: 22px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
  .top h2 { margin: 0; color: var(--blue-dark); font-size: 19px; }
  .top-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff;
  }
  .btn {
    background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 9px 16px;
    font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: var(--blue-dark); }
  .btn.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .status-msg { font-size: 13px; color: #5b7186; margin-inline-start: 4px; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px;
  }
  .card.needs-review { border-color: var(--red); background: var(--red-light); }
  .card.ok { border-color: var(--green); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer; }
  .card-title-wrap { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.red { background: var(--red); }
  .dot.green { background: var(--green); }
  .card-title { font-weight: 700; font-size: 15px; }
  .card-sub { color: #5b7186; font-size: 13px; margin-top: 3px; }
  .card-top-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .card-delete-btn {
    background: none; border: none; color: #a7b6c4; font-size: 20px; line-height: 1;
    cursor: pointer; padding: 2px 5px; border-radius: 5px;
  }
  .card-delete-btn:hover { color: #fff; background: var(--red); }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge.needs-review { background: var(--red); color: #fff; }
  .badge.ok { background: var(--green); color: #fff; }
  .badge.no-pdf { background: #999; color: #fff; }
  .raw-text {
    display: none; margin-top: 12px; background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; font-size: 12.5px; white-space: pre-wrap;
    max-height: 320px; overflow-y: auto; direction: ltr; text-align: left; font-family: monospace;
  }
  .raw-text.open { display: block; }
  .toggle-raw { background: none; border: none; color: var(--blue); font-size: 12px; cursor: pointer; padding: 0; margin-top: 8px; }
  .items-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  .items-table th { text-align: right; color: #5b7186; font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .items-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .items-table tr.low-confidence td { background: var(--red-light); }
  .items-table .num { direction: ltr; text-align: left; }
  .match-badge { font-size: 11.5px; padding: 2px 8px; border-radius: 12px; font-weight: 600; white-space: nowrap; display: inline-block; }
  .match-badge.ok { background: var(--green-light); color: var(--green); }
  .match-badge.warn { background: #fff4e0; color: #a86a00; }
  .match-badge.bad { background: var(--red-light); color: var(--red); }
  .match-badge.skip { background: #eee; color: #777; }
  .match-resolve-wrap { margin-top: 4px; }
  .match-resolve { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .match-resolve input {
    width: 220px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 12px; font-family: inherit;
  }
  .match-resolve .btn.tiny { padding: 3px 9px; font-size: 11.5px; border-radius: 5px; }
  .match-resolve .btn.tiny.skip-btn { background: #fff; color: var(--red); border: 1px solid var(--red); }
  .match-err { color: var(--red); font-size: 11px; margin-top: 2px; }
  .match-results { margin-top: 3px; max-width: 320px; }
  .match-results .result-row {
    padding: 4px 8px; font-size: 12px; border: 1px solid var(--border); border-top: none;
    background: #fff; cursor: pointer;
  }
  .match-results .result-row:first-child { border-top: 1px solid var(--border); border-radius: 5px 5px 0 0; }
  .match-results .result-row:last-child { border-radius: 0 0 5px 5px; }
  .match-results .result-row:hover { background: var(--blue-light); }
  .match-results .result-code { color: #5b7186; font-size: 11px; direction: ltr; display: inline-block; }
  .card-actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .branch-picker {
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 12.5px; font-family: inherit; background: #fff; color: var(--text);
  }
  .branch-picker.unset { border-color: var(--red); color: var(--red); }
  .empty { text-align: center; color: #5b7186; padding: 60px 20px; }
  .catalog-sync {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap; font-size: 13px;
  }
  .catalog-sync .status { color: #5b7186; }
  .catalog-sync input[type=file] { font-size: 12.5px; max-width: 220px; }
  .catalog-sync .sync-msg { font-size: 12.5px; }
  .catalog-sync .sync-msg.ok { color: var(--green); }
  .catalog-sync .sync-msg.err { color: var(--red); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="top">
    <h2>📦 מלאי — חשבוניות ספקים</h2>
    <div class="top-controls">
      <select id="branchFilter" onchange="loadRecords()">
        <option value="">כל הסניפים</option>
      </select>
      <select id="supplierFilter" onchange="applyFiltersAndRender()">
        <option value="">כל הספקים</option>
      </select>
      <label class="status-msg" style="margin-inline-start:4px;">מתאריך:
        <input type="date" id="dateFrom" onchange="applyFiltersAndRender()">
      </label>
      <label class="status-msg">עד תאריך:
        <input type="date" id="dateTo" onchange="applyFiltersAndRender()">
      </label>
      <button class="btn secondary" onclick="clearFilters()">נקה סינון</button>
      <button class="btn secondary" onclick="checkNow()">🔄 בדוק עכשיו</button>
      <span id="statusMsg" class="status-msg"></span>
    </div>
  </div>

  <div class="catalog-sync" id="summaryBar"></div>

  <div class="catalog-sync">
    <strong>קטלוג מוצרים (Cash On Tab):</strong>
    <span class="status" id="catalogStatus">טוען...</span>
    <label class="btn small secondary" style="cursor:pointer;">
      📤 עדכון קטלוג
      <input type="file" id="catalogFile" accept=".xlsx" style="display:none" onchange="syncCatalogFile(this.files[0])">
    </label>
    <span class="sync-msg" id="catalogSyncMsg"></span>
  </div>
  <div id="cards" class="cards"></div>
  <div id="emptyMsg" class="empty" style="display:none">אין עדיין חשבוניות. לחצי על "בדוק עכשיו" כדי לבדוק את המייל.</div>

<script>
let branchOptions = [];

async function loadBranchOptions() {
  const res = await fetch("/api/inventory/branch-options");
  if (!res.ok) return;
  branchOptions = await res.json();
}

async function setBranch(recordId, branch) {
  const res = await fetch(`/api/inventory/set-branch/${recordId}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ branch }),
  });
  if (res.ok) { await loadBranches(); await loadRecords(); }
}

async function loadBranches() {
  const res = await fetch("/api/inventory/branches");
  if (!res.ok) return;
  const branches = await res.json();
  const sel = document.getElementById("branchFilter");
  const current = sel.value;
  sel.innerHTML = '<option value="">כל הסניפים</option>' +
    branches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join("");
  sel.value = current;
}

let RAW_RECORDS = [];
let SUPPLIER_NAMES = {};

async function loadSupplierNames() {
  const res = await fetch("/api/inventory/supplier-names");
  if (res.ok) SUPPLIER_NAMES = await res.json();
}

async function loadRecords() {
  const branch = document.getElementById("branchFilter").value;
  const url = branch ? `/api/inventory/list?branch=${encodeURIComponent(branch)}` : "/api/inventory/list";
  const res = await fetch(url);
  if (!res.ok) {
    document.getElementById("cards").innerHTML = "";
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = "שגיאה בטעינה: " + (await res.text());
    document.getElementById("summaryBar").innerHTML = "";
    return;
  }
  RAW_RECORDS = await res.json();
  populateSupplierFilter();
  applyFiltersAndRender();
}

function populateSupplierFilter() {
  const sel = document.getElementById("supplierFilter");
  const current = sel.value;
  const domains = [...new Set(RAW_RECORDS.map(r => r.supplier_domain).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">כל הספקים</option>' +
    domains.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(SUPPLIER_NAMES[d] || d)}</option>`).join("");
  sel.value = current;
}

// received_at as local YYYY-MM-DD, to compare against <input type=date> values.
function recordDateStr(r) {
  if (!r.received_at) return null;
  const d = new Date(r.received_at);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function applyFiltersAndRender() {
  const supplier = document.getElementById("supplierFilter").value;
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;

  let records = RAW_RECORDS;
  if (supplier) records = records.filter(r => r.supplier_domain === supplier);
  if (dateFrom) records = records.filter(r => { const d = recordDateStr(r); return d && d >= dateFrom; });
  if (dateTo) records = records.filter(r => { const d = recordDateStr(r); return d && d <= dateTo; });

  renderCards(records);
  renderSummary(records);
}

function renderSummary(records) {
  const bar = document.getElementById("summaryBar");
  if (!RAW_RECORDS.length) { bar.innerHTML = ""; return; }
  let total = 0;
  records.forEach(r => (r.line_items || []).forEach(it => { total += Number(it.total) || 0; }));
  const totalStr = total.toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  bar.innerHTML = `מציג <strong>${records.length}</strong> חשבוניות מתוך ${RAW_RECORDS.length} &nbsp;·&nbsp; סה"כ מוצג: <strong>₪${totalStr}</strong>`;
}

function renderCards(records) {
  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";
  document.getElementById("emptyMsg").style.display = records.length ? "none" : "block";
  document.getElementById("emptyMsg").textContent = RAW_RECORDS.length
    ? "אין חשבוניות התואמות את הסינון שנבחר."
    : 'אין עדיין חשבוניות. לחצי על "בדוק עכשיו" כדי לבדוק את המייל.';

  records.forEach(r => {
    const isReview = r.status === "needs_review" || r.status === "no_pdf_found";
    const cls = isReview ? "needs-review" : (r.status === "ok" ? "ok" : "");
    const dotCls = isReview ? "red" : "green";
    const badgeLabel = r.status === "needs_review" ? "לבדוק"
      : r.status === "no_pdf_found" ? "אין PDF"
      : r.status === "ok" ? "בוצע" : r.status;
    const div = document.createElement("div");
    div.className = "card " + cls;
    const received = r.received_at ? new Date(r.received_at).toLocaleString("he-IL") : "";
    const items = r.line_items || [];
    const anyLowConf = items.some(it => it.confident === false && !it.resolved);
    const itemsTable = items.length ? `
      <table class="items-table">
        <thead><tr><th></th><th>פריט / ברקוד</th><th>תיאור</th><th>כמות</th><th>מחיר יח'</th><th>סה"כ</th><th>התאמה למלАי</th><th></th></tr></thead>
        <tbody>
          ${items.map((it, idx) => {
            const flagged = it.confident === false && !it.resolved;
            return `
            <tr class="${flagged ? 'low-confidence' : ''}">
              <td>${flagged ? '🔴' : '🟢'}</td>
              <td class="num">${escapeHtml(it.sku ?? it.barcode ?? "")}</td>
              <td>${escapeHtml(it.description || "")}</td>
              <td class="num">${it.quantity ?? ""}</td>
              <td class="num">${it.unit_price ?? ""}</td>
              <td class="num">${it.total ?? ""}</td>
              <td>${matchCell(r.id, idx, it)}</td>
              <td>${flagged ? `<button class="toggle-raw" onclick="event.stopPropagation(); resolveItem(${r.id}, ${idx})">✓ תיקנתי</button>` : ""}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      ${anyLowConf ? `<div style="margin-top:6px;color:var(--red);font-size:12.5px;">🔴 = הסכום (כמות × מחיר) לא תואם את הסכום בחשבונית — הפריט עדיין יוזן, בדוק/י את הסכום ולחצ/י "תיקנתי".</div>` : ""}
      ` : `<div style="margin-top:8px;color:#5b7186;font-size:13px;">
          לא זוהו פריטים אוטומטית — ראה/י טקסט מקורי.
          <button class="toggle-raw" onclick="event.stopPropagation(); reparseInvoice(${r.id})" id="reparse-${r.id}">🔄 פרש מחדש</button>
        </div>`;
    div.innerHTML = `
      <div class="card-top" onclick="toggleRaw(${r.id})">
        <div class="card-title-wrap">
          <span class="dot ${anyLowConf ? 'red' : dotCls}"></span>
          <div>
            <div class="card-title">${escapeHtml(r.subject || "(ללא נושא)")}</div>
            <div class="card-sub">${escapeHtml(r.sender_email || "")} · ${escapeHtml(received)}
              ${r.invoice_number ? " · מס' חשבונית: " + escapeHtml(r.invoice_number) : ""}
            </div>
          </div>
        </div>
        <div class="card-top-right">
          <span class="badge ${isReview ? 'needs-review' : (r.status === 'ok' ? 'ok' : 'no-pdf')}">${escapeHtml(badgeLabel)}</span>
          <button class="card-delete-btn" title="מחק/י חשבונית זו" onclick="event.stopPropagation(); deleteRecord(${r.id})">✕</button>
        </div>
      </div>
      ${itemsTable}
      <button class="toggle-raw" onclick="event.stopPropagation(); toggleRaw(${r.id})">הצג/הסתר טקסט מקורי</button>
      <div class="raw-text" id="raw-${r.id}">${escapeHtml(r.raw_text || "(אין טקסט)")}</div>
      <div class="card-actions">
        <label style="font-size:12.5px;color:#5b7186;">סניף:</label>
        <select class="branch-picker ${r.branch ? "" : "unset"}" onchange="event.stopPropagation(); setBranch(${r.id}, this.value)">
          <option value="">— לא נבחר —</option>
          ${branchOptions.map(b => `<option value="${escapeHtml(b)}" ${b === r.branch ? "selected" : ""}>${escapeHtml(b)}</option>`).join("")}
        </select>
        ${isReview ? `
          <button class="btn small" onclick="markOk(${r.id})">✓ סימנתי כטופל</button>
          <button class="btn small secondary" onclick="autoEnter(${r.id}, this)">🤖 הכנס למלאי אוטומטית</button>
        ` : r.status === "ok" ? `
          <button class="btn small secondary" onclick="revertToReview(${r.id})" title="השתמש/י אם סומן כטופל בטעות, או שהמסמך בקאש און טאב לא הושלם/בוטל בפועל">↺ החזר לבדיקה</button>
        ` : ""}
      </div>
      <div id="autoenter-${r.id}"></div>
    `;
    cardsEl.appendChild(div);
  });
}

function matchCell(recordId, idx, it) {
  const src = it.match_source;
  if (src === "skip") {
    return `<span class="match-badge skip">לא נכנס למלАי</span> ${fixToggle(recordId, idx)}${matchResolveInput(recordId, idx, true)}`;
  }
  if (src === "matched" || src === "exact" || src === "learned" || (src === "fuzzy" && !it.needs_confirmation)) {
    return `<span class="match-badge ok">✓ ${escapeHtml(it.matched_name || "")}</span> ${fixToggle(recordId, idx)}${matchResolveInput(recordId, idx, true)}`;
  }
  if (src === "new_pending") {
    return `
      <span class="match-badge warn">מוצר חדש — להוסיף לקטלוג</span>
      ${matchResolveInput(recordId, idx)}
    `;
  }
  // fuzzy-but-unsure, or no match at all ("none"/undefined)
  const guess = it.matched_name ? `<div style="font-size:11.5px;color:#a86a00;">ניחוש: ${escapeHtml(it.matched_name)}</div>` : "";
  return `
    <span class="match-badge bad">${src === "fuzzy" ? "לא בטוח" : "לא נמצא"}</span>
    ${guess}
    ${matchResolveInput(recordId, idx)}
  `;
}

function fixToggle(recordId, idx) {
  const cellId = `match-${recordId}-${idx}`;
  return `<button class="toggle-raw" style="font-size:11px;" onclick="event.stopPropagation(); document.getElementById('${cellId}-wrap').style.display='block'; this.style.display='none';">✏️ לא נכון? תקן</button>`;
}

function matchResolveInput(recordId, idx, hidden) {
  const cellId = `match-${recordId}-${idx}`;
  return `
    <div class="match-resolve-wrap" id="${cellId}-wrap" ${hidden ? 'style="display:none"' : ''} onclick="event.stopPropagation()">
      <div class="match-resolve" id="${cellId}">
        <input type="text" placeholder="חפשי לפי שם (למשל TITANIUM 14) או הזיני ברקוד" id="${cellId}-input"
               oninput="searchCatalogDebounced(${recordId}, ${idx}, '${cellId}')">
        <button class="btn tiny" onclick="matchItemBarcode(${recordId}, ${idx}, '${cellId}')">✓ הזן</button>
        <button class="btn tiny skip-btn" onclick="skipItemMatch(${recordId}, ${idx}, '${cellId}')">✗ לא להכניס</button>
      </div>
      <div class="match-results" id="${cellId}-results"></div>
    </div>
    <div class="match-err" id="${cellId}-err"></div>
  `;
}

async function matchItemBarcode(recordId, idx, cellId, force) {
  const input = document.getElementById(`${cellId}-input`);
  const errEl = document.getElementById(`${cellId}-err`);
  const barcode = (input.value || "").trim();
  errEl.textContent = "";
  if (!barcode) { errEl.textContent = "הזיני ברקוד"; return; }
  const res = await fetch(`/api/inventory/match-item/${recordId}/${idx}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "matched", barcode, force: !!force }),
  });
  if (res.ok) { loadRecords(); return; }
  if (res.status === 409) {
    // Not in the catalogue snapshot -- offer to save anyway (e.g. a
    // product she just added directly in Cash On Tab).
    const msg = await res.text();
    errEl.innerHTML = `${escapeHtml(msg)} <button class="btn tiny" onclick="matchItemBarcode(${recordId}, ${idx}, '${cellId}', true)">שמור בכל זאת</button>`;
    return;
  }
  errEl.textContent = await res.text();
}

const _searchTimers = {};

function searchCatalogDebounced(recordId, idx, cellId) {
  clearTimeout(_searchTimers[cellId]);
  _searchTimers[cellId] = setTimeout(() => runCatalogSearch(recordId, idx, cellId), 300);
}

async function runCatalogSearch(recordId, idx, cellId) {
  const input = document.getElementById(`${cellId}-input`);
  const resultsEl = document.getElementById(`${cellId}-results`);
  const q = (input.value || "").trim();
  if (q.length < 2) { resultsEl.innerHTML = ""; return; }
  const res = await fetch(`/api/inventory/search-catalog?q=${encodeURIComponent(q)}`);
  if (!res.ok) return;
  const results = await res.json();
  resultsEl.innerHTML = results.map(it => `
    <div class="result-row" onclick="pickCatalogResult(${recordId}, ${idx}, '${cellId}', ${JSON.stringify(it.code)})">
      ${escapeHtml(it.name)} <span class="result-code">· ${escapeHtml(it.code)}${it.barcode ? " / " + escapeHtml(it.barcode) : ""}</span>
    </div>
  `).join("") || `<div class="result-row" style="cursor:default;color:#5b7186;">אין תוצאות</div>`;
}

function pickCatalogResult(recordId, idx, cellId, code) {
  document.getElementById(`${cellId}-input`).value = code;
  document.getElementById(`${cellId}-results`).innerHTML = "";
  matchItemBarcode(recordId, idx, cellId);
}

async function skipItemMatch(recordId, idx, cellId) {
  const res = await fetch(`/api/inventory/match-item/${recordId}/${idx}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "skip" }),
  });
  if (res.ok) { loadRecords(); }
  else { document.getElementById(`${cellId}-err`).textContent = await res.text(); }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function toggleRaw(id) {
  document.getElementById(`raw-${id}`).classList.toggle("open");
}

async function resolveItem(recordId, itemIndex) {
  const res = await fetch(`/api/inventory/resolve-item/${recordId}/${itemIndex}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ resolved: true }),
  });
  if (res.ok) loadRecords();
}

async function markOk(id) {
  const res = await fetch(`/api/inventory/mark/${id}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "ok" }),
  });
  if (res.ok) loadRecords();
}

async function revertToReview(id) {
  const res = await fetch(`/api/inventory/mark/${id}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "needs_review" }),
  });
  if (res.ok) loadRecords();
}

async function autoEnter(id, btnEl) {
  const errEl = document.getElementById(`autoenter-${id}`);
  errEl.innerHTML = "";
  btnEl.disabled = true;
  const originalText = btnEl.textContent;
  btnEl.textContent = "מבצע/ת בקאש און טאב...";
  try {
    const res = await fetch(`/api/inventory/auto-enter/${id}`, { method: "POST" });
    if (res.ok) { await loadRecords(); return; }
    let msg, screenshot = null;
    if ((res.headers.get("content-type") || "").includes("application/json")) {
      const data = await res.json();
      msg = data.error || JSON.stringify(data);
      screenshot = data.screenshot_b64;
    } else {
      msg = await res.text();
    }
    errEl.innerHTML = `<div class="match-err">שגיאה בהכנסה אוטומטית: ${escapeHtml(msg)}</div>` +
      (screenshot ? `<img src="data:image/png;base64,${screenshot}" alt="מסך Cash On Tab בזמן השגיאה"
         style="max-width:100%;border:1px solid var(--border);border-radius:6px;margin-top:6px;">` : "");
  } catch (e) {
    errEl.innerHTML = `<div class="match-err">שגיאת רשת: ${escapeHtml(String(e))}</div>`;
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = originalText;
  }
}

async function deleteRecord(id) {
  if (!confirm("למחוק את החשבונית הזו מהרשימה? הפעולה לא ניתנת לביטול (התאמות מוצרים שכבר נלמדו ממנה יישארו).")) return;
  const res = await fetch(`/api/inventory/delete/${id}`, { method: "POST" });
  if (res.ok) loadRecords();
  else alert("שגיאה במחיקה: " + (await res.text()));
}

async function reparseInvoice(id) {
  const btn = document.getElementById(`reparse-${id}`);
  if (btn) btn.textContent = "מפרש...";
  const res = await fetch(`/api/inventory/reparse/${id}`, { method: "POST" });
  if (res.ok) { loadRecords(); }
  else { if (btn) btn.textContent = "שגיאה: " + (await res.text()); }
}

async function checkNow() {
  const statusEl = document.getElementById("statusMsg");
  statusEl.textContent = "בודק...";
  const res = await fetch("/api/inventory/check-now", { method: "POST" });
  if (!res.ok) {
    statusEl.textContent = "שגיאה: " + (await res.text());
    return;
  }
  const result = await res.json();
  statusEl.textContent = `נמצאו ${result.created} חדשות (${result.skipped} כבר נבדקו)`;
  await loadBranches();
  await loadRecords();
}

// Expected Cash On Tab export headers (same as her original Items.xlsx).
const CATALOG_HEADERS = { code: "קוד פריט", barcode: "ברקוד פריט", name: "שם פריט", active: "פעיל" };

async function loadCatalogStatus() {
  const el = document.getElementById("catalogStatus");
  try {
    const res = await fetch("/api/inventory/catalog-status");
    if (!res.ok) { el.textContent = "שגיאה בטעינת סטטוס"; return; }
    const s = await res.json();
    const when = s.last_synced_at ? new Date(s.last_synced_at).toLocaleString("he-IL") : null;
    el.textContent = s.synced_from_db
      ? `${s.item_count} מוצרים · עודכן לאחרונה: ${when}`
      : `${s.item_count} מוצרים · מהקובץ המקורי (עדיין לא סונכרן דרך הכפתור)`;
  } catch (e) {
    el.textContent = "שגיאה בטעינת סטטוס";
  }
}

function syncCatalogFile(file) {
  const msgEl = document.getElementById("catalogSyncMsg");
  if (!file) return;
  msgEl.className = "sync-msg";
  msgEl.textContent = "קורא קובץ...";

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      const items = rows.map(r => ({
        code: String(r[CATALOG_HEADERS.code] ?? "").trim(),
        barcode: String(r[CATALOG_HEADERS.barcode] ?? "").trim(),
        name: String(r[CATALOG_HEADERS.name] ?? "").trim(),
        active: r[CATALOG_HEADERS.active] === false ? false : true,
      })).filter(it => it.code && it.name);

      if (!items.length) {
        msgEl.className = "sync-msg err";
        msgEl.textContent = 'לא נמצאו שורות תקינות — ודאי שהעמודות הן "קוד פריט"/"ברקוד פריט"/"שם פריט"/"פעיל".';
        return;
      }

      msgEl.textContent = `מעדכן ${items.length} מוצרים...`;
      const res = await fetch("/api/inventory/sync-catalog", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items }),
      });
      if (!res.ok) {
        msgEl.className = "sync-msg err";
        msgEl.textContent = "שגיאה: " + (await res.text());
        return;
      }
      const result = await res.json();
      msgEl.className = "sync-msg ok";
      msgEl.textContent = `✓ עודכנו ${result.item_count} מוצרים`;
      loadCatalogStatus();
    } catch (err) {
      msgEl.className = "sync-msg err";
      msgEl.textContent = "שגיאה בקריאת הקובץ: " + err.message;
    } finally {
      document.getElementById("catalogFile").value = "";
    }
  };
  reader.readAsArrayBuffer(file);
}

function clearFilters() {
  document.getElementById("supplierFilter").value = "";
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  applyFiltersAndRender();
}

loadSupplierNames().then(() => loadBranchOptions().then(loadRecords));
loadBranches();
loadCatalogStatus();
